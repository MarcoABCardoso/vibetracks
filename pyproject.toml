[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetracks"
version = "0.1.0"
description = "A game-soundtrack lab: model songs as JSON, compile them to WAV with pure-Python synthesis."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# Sample-based realism (the "soundfont" engine). Also needs the FluidSynth
# system library + a General MIDI .sf2 — see CLAUDE.md / scripts/setup-soundfont.sh.
soundfont = ["pyfluidsynth>=1.3.0"]
# Sprite compositing (the "lpc" engine). Reads real LPC layer PNGs via Pillow;
# the spec/validate path needs only numpy, exactly like the soundfont split.
sprites = ["Pillow>=10"]
# Game-ready compressed export (render --format ogg/mp3/flac). OGG/FLAC via
# libsndfile (soundfile); MP3 via a self-contained LAME wheel (lameenc). WAV
# export needs none of this. See vibetracks/audioexport.py.
export = ["soundfile>=0.12", "lameenc>=1.7"]

[project.scripts]
vibetracks = "vibetracks.__main__:main"
vibesprites = "vibesprites.__main__:main"

[tool.setuptools]
packages = ["vibetracks", "vibesprites"]
